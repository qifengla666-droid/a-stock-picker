version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a-stock-picker-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/stocks.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: python main.py
    networks:
      - stock-picker-network
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: a-stock-picker-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - stock-picker-network
    restart: unless-stopped

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: a-stock-picker-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - stock-picker-network
    restart: unless-stopped

networks:
  stock-picker-network:
    driver: bridge

volumes:
  data:
  logs:
